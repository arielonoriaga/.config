# NVIDIA driver options for Wayland stability
# Copy this to /etc/modprobe.d/nvidia.conf with sudo
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_UsePageAttributeTable=1
options nvidia NVreg_EnablePCIeGen3=1
options nvidia NVreg_EnableMSI=1
# Prevent flickering and improve frame timing with lower latency
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/tmp
# Reduce input lag while maintaining stability
options nvidia NVreg_DynamicPowerManagement=0x00
options nvidia NVreg_PowerMizerEnable=0
options nvidia NVreg_PowerMizerLevel=0x1
options nvidia NVreg_PowerMizerLevelAC=0x1