# Tmux Configuration
# ==================

# Prefix key (default)
set -g prefix C-b

# Basic settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window and pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode (vim-like)
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind ] paste-buffer

# Session management
bind R source-file ~/.config/nvim/tmux.conf \; display-message "Config reloaded!"
bind S choose-session

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#2e3440,fg=#eceff4"

# Status left
set -g status-left-length 40
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0]"

# Status right
set -g status-right-length 80
set -g status-right "#[fg=#81a1c1]#[bg=#81a1c1,fg=#2e3440] %H:%M #[bg=#88c0d0,fg=#2e3440,bold] %d-%b-%y "

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#81a1c1,fg=#2e3440,bold] #I:#W "
setw -g window-status-current-style "bg=#81a1c1,fg=#2e3440"
setw -g window-status-activity-style "bg=#bf616a,fg=#2e3440"

# Pane borders
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"

# Message styling
set -g message-style "bg=#ebcb8b,fg=#2e3440"
set -g message-command-style "bg=#ebcb8b,fg=#2e3440"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

