[env]
TERM = "xterm-256color"

[window]
blur = true
opacity = 0.92
dynamic_padding = false
decorations = "None"
resize_increments = false
padding.y = 0
padding.x = 0

[font]
size = 12
offset.x = 0
offset.y = 0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"

[scrolling]
history = 1000
multiplier = 3

[mouse]
hide_when_typing = true

# Catppuccin Mocha colors to match waybar
[colors.primary]
background = '#1e1e2e'
foreground = '#cdd6f4'

[colors.cursor]
text = '#1e1e2e'
cursor = '#f5e0dc'

[colors.vi_mode_cursor]
text = '#1e1e2e'
cursor = '#b4befe'

[colors.selection]
text = '#1e1e2e'
background = '#f5e0dc'

[colors.normal]
black   = '#45475a'
red     = '#f38ba8'
green   = '#a6e3a1'
yellow  = '#f9e2af'
blue    = '#89b4fa'
magenta = '#f5c2e7'
cyan    = '#94e2d5'
white   = '#bac2de'

[colors.bright]
black   = '#585b70'
red     = '#f38ba8'
green   = '#a6e3a1'
yellow  = '#f9e2af'
blue    = '#89b4fa'
magenta = '#f5c2e7'
cyan    = '#94e2d5'
white   = '#a6adc8'
