[general]
import = ["~/.local/state/aurora/alacritty.toml"]

[env]
TERM = "xterm-256color"

[window]
blur = true
opacity = 0.9
dynamic_padding = false
decorations = "None"
resize_increments = false
padding.y = 0
padding.x = 0

[font]
size = 12
offset.x = 0
offset.y = 0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"

[scrolling]
history = 1000
multiplier = 3

[mouse]
hide_when_typing = true

[colors.normal]
red     = '#f48fb1'
green   = '#a8e6cf'
yellow  = '#ffe0a3'
blue    = '#a3b8ff'
magenta = '#d7a8f5'
cyan    = '#9ee6f0'
white   = '#d8cdea'

[colors.bright]
red     = '#f8a9c6'
green   = '#bdf0dc'
yellow  = '#ffeac0'
blue    = '#bccbff'
magenta = '#e4c1f9'
cyan    = '#b8eef5'
white   = '#f3ecfb'
