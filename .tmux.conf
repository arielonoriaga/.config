# Tmux Configuration
# ==================

# Prefix key (default)
set -g prefix C-b

# Basic settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -s escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window and pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode (vim-like)
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind ] paste-buffer

# Session management
bind R source-file ~/.config/.tmux.conf \; display-message "Config reloaded!"
bind S choose-session

# Hide status bar when nvim is running
set-hook -g pane-focus-in 'if -F "#{m/r:(^|\/)n?vim(diff)?$,#{pane_current_command}}" "set status off" "set status on"'
set-hook -g pane-focus-out 'set status on'

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 40
setw -g window-status-separator ""
set -g pane-border-status off
source-file -q ~/.local/state/aurora/tmux.conf

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off


# Plugin manager (tpm)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'