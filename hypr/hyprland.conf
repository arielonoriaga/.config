# ─────────────────────────────────────────────────────────────
#  Hyprland config — ported from ~/.config/sway/config
#  $mainMod = SUPER  (Mod4 / the "command" key) — same as sway
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER
$term    = alacritty
$menu    = fuzzel

### Host ──────────────────────────────────────────────────────
source = ~/.config/hypr/host.conf

### Look and feel ─────────────────────────────────────────────
# Aurora theme (~/.config/theme/aurora). Previous look: ~/.config/theme-backup-2026-11-19/hypr
general {
    gaps_in     = 6
    gaps_out    = 12
    border_size = 2
    col.active_border   = rgba(f5b8daee) rgba(c9a7f0ee) 45deg
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = true
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(140a2899)
    }
}

animations {
    enabled = true
    bezier = mac, 0.25, 1, 0.5, 1
    bezier = pop, 0.2, 0.9, 0.1, 1.05
    animation = windows, 1, 3, pop, popin 90%
    animation = windowsOut, 1, 2, mac, popin 90%
    animation = border, 1, 4, mac
    animation = fade, 1, 2.5, mac
    animation = workspaces, 1, 3, mac, slide
    animation = layers, 1, 2.5, mac, fade
}

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace launcher
layerrule = ignore_alpha 0.2, match:namespace launcher
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.2, match:namespace notifications

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = ELECTRON_OZONE_PLATFORM_HINT,auto

### Autostart ─────────────────────────────────────────────────
exec-once = waybar -c ~/.config/waybar/config.jsonc
exec-once = mako
exec-once = ~/.config/theme/aurora/wallpaper.sh
exec-once = quickshell

### Basics ────────────────────────────────────────────────────
bind = $mainMod, Return, exec, $term
bind = $mainMod, Q, exec, $term        # also keep Super+Q as terminal
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, W, exec, ~/.config/theme/aurora/wallpaper.sh
# Sway guarded this with a swaynag confirmation; Hyprland has no equivalent and
# there is no display manager here, so a stray press drops you to a bare tty.
# Disabled deliberately -- run `hyprctl dispatch exit` when you actually mean it.
# bind = $mainMod SHIFT, E, exit

# floating_modifier $mod normal
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

### Focus ─────────────────────────────────────────────────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, Left,  movefocus, l
bind = $mainMod, Down,  movefocus, d
bind = $mainMod, Up,    movefocus, u
bind = $mainMod, Right, movefocus, r

### Move window ───────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Left,  movewindow, l
bind = $mainMod SHIFT, Down,  movewindow, d
bind = $mainMod SHIFT, Up,    movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

### Workspaces ────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

### Layout ────────────────────────────────────────────────────
# sway $mod+b splith / $mod+v splitv -> dwindle preselect
bind = $mainMod, B, layoutmsg, preselect r
bind = $mainMod, V, layoutmsg, preselect d
# sway $mod+e "layout toggle split" -> exact match
bind = $mainMod, E, layoutmsg, togglesplit
# sway $mod+w tabbed -> Hyprland groups are the tabbed equivalent
bind = $mainMod, W, togglegroup
# sway $mod+s stacking -> no equivalent; cycles within a group instead
bind = $mainMod, S, changegroupactive, f
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Space, togglefloating
# sway $mod+space "focus mode_toggle" -> nearest: cycle windows
bind = $mainMod, Space, cyclenext
# NOTE: sway $mod+a "focus parent" has no Hyprland equivalent — unbound.

### Scratchpad ────────────────────────────────────────────────
bind = $mainMod SHIFT, minus, movetoworkspacesilent, special:scratch
bind = $mainMod, minus, togglespecialworkspace, scratch

### Resize mode (sway: $mod+r) ────────────────────────────────
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , Left,  resizeactive, -10 0
binde = , Down,  resizeactive, 0 10
binde = , Up,    resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

### Media / brightness (bindl = also works when locked) ───────
bindl  = , XF86AudioMute,         exec, pactl set-sink-mute   @DEFAULT_SINK@ toggle
bindel = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl  = , XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+

### Screenshots / recording ───────────────────────────────────
bind = , Print,            exec, ~/.config/scripts/screenshot.sh area
bind = SHIFT, Print,       exec, ~/.config/scripts/screenshot.sh fullscreen
bind = $mainMod, Print,    exec, ~/.config/scripts/screenshot.sh window
bind = $mainMod SHIFT, R,       exec, ~/.config/scripts/screenrecord.sh area
bind = $mainMod SHIFT CTRL, R,  exec, ~/.config/scripts/screenrecord.sh fullscreen
bind = $mainMod SHIFT ALT, R,   exec, ~/.config/scripts/screenrecord.sh area-no-audio
bind = $mainMod SHIFT, F12,     exec, ~/.config/scripts/screenrecord.sh fullscreen noaudio
bind = $mainMod, O,             exec, ~/.config/scripts/obs.sh

### Latency ───────────────────────────────────────────────────
# Default repeat is 25/s after 600ms, which feels sluggish next to a laptop.
input {
    repeat_rate  = 50
    repeat_delay = 250
}

# NVIDIA hardware cursor lags/stutters on Hyprland; software cursor is smoother.
cursor {
    no_hardware_cursors = 1
}

# Allow tearing (lower latency) only for the terminal.
general {
    allow_tearing = true
}
windowrule = immediate on, match:class ^(Alacritty)$

### Gaming ────────────────────────────────────────────────────
# VRR only while a window is fullscreen (mode 2) -- always-on flickers on NVIDIA.
misc {
    vrr = 2
}
# Tearing/immediate presentation for Proton games (Steam sets class steam_app_<id>).
windowrule = immediate on, match:class ^steam_app_

